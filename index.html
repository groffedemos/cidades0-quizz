<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Teste seus conhecimentos sobre capitais de países do mundo."
    >
    <title>Cidades do Mundo | Quiz de Capitais</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
      }

      main {
        width: min(100%, 46rem);
      }

      header {
        text-align: center;
        margin-bottom: 1.5rem;
      }

      h1 {
        color: #0f3d6e;
        margin: 0;
      }

      header p {
        margin-bottom: 0;
      }

      form,
      #resultado {
        background: #ffffff;
        border-radius: 1rem;
        box-shadow: 0 0.75rem 2rem rgb(15 23 42 / 12%);
        padding: clamp(1.25rem, 4vw, 2rem);
      }

      .questao {
        border: 0;
        border-bottom: 1px solid #dbe3ee;
        margin: 0 0 1.5rem;
        padding: 0 0 1.5rem;
      }

      .questao:last-of-type {
        margin-bottom: 1.25rem;
      }

      legend {
        font-weight: 700;
        margin-bottom: 0.75rem;
      }

      label {
        align-items: center;
        border-radius: 0.5rem;
        cursor: pointer;
        display: flex;
        gap: 0.6rem;
        margin: 0.35rem 0;
        padding: 0.55rem;
      }

      label:hover,
      label:has(input:focus-visible) {
        background: #e0f2fe;
      }

      input {
        accent-color: #0f766e;
      }

      button {
        background: #0f766e;
        border: 0;
        border-radius: 0.5rem;
        color: #ffffff;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 700;
        padding: 0.75rem 1.25rem;
      }

      button:hover,
      button:focus-visible {
        background: #115e59;
      }

      #resultado {
        margin-top: 1.5rem;
        text-align: center;
      }

      #resultado h2 {
        color: #0f3d6e;
        margin-top: 0;
      }

      .erro {
        color: #b91c1c;
        font-weight: 700;
        margin: 0 0 1rem;
      }

      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Cidades do Mundo</h1>
        <p>Responda às seis perguntas sobre capitais ao redor do globo.</p>
      </header>

      <form id="quiz" novalidate>
        <p id="mensagem-erro" class="erro" role="alert" hidden></p>

        <fieldset class="questao">
          <legend>1. Qual é a capital do Japão?</legend>
          <label><input type="radio" name="q1" value="Seul"> Seul</label>
          <label><input type="radio" name="q1" value="Tóquio"> Tóquio</label>
          <label><input type="radio" name="q1" value="Pequim"> Pequim</label>
        </fieldset>

        <fieldset class="questao">
          <legend>2. Qual é a capital da Austrália?</legend>
          <label><input type="radio" name="q2" value="Sydney"> Sydney</label>
          <label><input type="radio" name="q2" value="Melbourne"> Melbourne</label>
          <label><input type="radio" name="q2" value="Canberra"> Canberra</label>
        </fieldset>

        <fieldset class="questao">
          <legend>3. Qual é a capital do Canadá?</legend>
          <label><input type="radio" name="q3" value="Toronto"> Toronto</label>
          <label><input type="radio" name="q3" value="Vancouver"> Vancouver</label>
          <label><input type="radio" name="q3" value="Ottawa"> Ottawa</label>
        </fieldset>

        <fieldset class="questao">
          <legend>4. Qual é a capital do Egito?</legend>
          <label><input type="radio" name="q4" value="Cairo"> Cairo</label>
          <label><input type="radio" name="q4" value="Alexandria"> Alexandria</label>
          <label><input type="radio" name="q4" value="Luxor"> Luxor</label>
        </fieldset>

        <fieldset class="questao">
          <legend>5. Qual é a capital da Argentina?</legend>
          <label><input type="radio" name="q5" value="Córdoba"> Córdoba</label>
          <label><input type="radio" name="q5" value="Buenos Aires"> Buenos Aires</label>
          <label><input type="radio" name="q5" value="Rosário"> Rosário</label>
        </fieldset>

        <fieldset class="questao">
          <legend>6. Qual é a capital da Noruega?</legend>
          <label><input type="radio" name="q6" value="Bergen"> Bergen</label>
          <label><input type="radio" name="q6" value="Oslo"> Oslo</label>
          <label><input type="radio" name="q6" value="Trondheim"> Trondheim</label>
        </fieldset>

        <button type="submit">Ver resultado</button>
      </form>

      <section id="resultado" aria-live="polite" hidden>
        <h2>Resultado</h2>
        <p id="pontuacao"></p>
        <p id="feedback"></p>
        <button id="reiniciar" type="button">Tentar novamente</button>
      </section>
    </main>

    <script>
      const respostas = {
        q1: "Tóquio",
        q2: "Canberra",
        q3: "Ottawa",
        q4: "Cairo",
        q5: "Buenos Aires",
        q6: "Oslo"
      };

      const quiz = document.querySelector("#quiz");
      const resultado = document.querySelector("#resultado");
      const mensagemErro = document.querySelector("#mensagem-erro");
      const pontuacao = document.querySelector("#pontuacao");
      const feedback = document.querySelector("#feedback");
      const reiniciar = document.querySelector("#reiniciar");

      quiz.addEventListener("submit", (evento) => {
        evento.preventDefault();
        const respostasEnviadas = new FormData(quiz);
        const perguntasSemResposta = Object.keys(respostas).filter(
          (pergunta) => !respostasEnviadas.has(pergunta)
        );

        if (perguntasSemResposta.length > 0) {
          mensagemErro.textContent = "Responda a todas as perguntas antes de continuar.";
          mensagemErro.hidden = false;
          return;
        }

        const acertos = Object.entries(respostas).filter(
          ([pergunta, resposta]) => respostasEnviadas.get(pergunta) === resposta
        ).length;

        mensagemErro.hidden = true;
        pontuacao.textContent = `Você acertou ${acertos} de ${Object.keys(respostas).length} perguntas.`;
        feedback.textContent =
          acertos === 6
            ? "Excelente! Você conhece muito bem as capitais do mundo."
            : acertos >= 4
              ? "Muito bem! Continue explorando o mundo."
              : "Bom esforço! Tente novamente para melhorar sua pontuação.";
        resultado.hidden = false;
        resultado.scrollIntoView({ behavior: "smooth", block: "center" });
      });

      reiniciar.addEventListener("click", () => {
        quiz.reset();
        mensagemErro.hidden = true;
        resultado.hidden = true;
        quiz.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    </script>
  </body>
</html>
